# Streamlit theme.
#
# The theme lives here rather than in injected CSS. Painting .stApp with CSS
# left Streamlit itself on its own theme: headings stayed rgb(49,51,63) and
# every widget kept default styling. Setting the real theme makes Streamlit's
# controls follow along instead of being fought with selectors.
#
# The palette is unbranded on purpose — this used to carry the SainTech blue,
# which was inherited rather than chosen for a price-comparison list.

[theme]
base = "light"

# One accent, and it stays out of the way. The green / amber / red that mark a
# listing's value are the page's only saturated colour, so the interactive
# accent is a calm blue that cannot be mistaken for a verdict.
primaryColor             = "#1A6ACF"
backgroundColor          = "#F5F6F8"   # cool off-white, not paper cream
secondaryBackgroundColor = "#FFFFFF"   # rows and panels sit above the ground
textColor                = "#111418"   # near-black with a blue bias
borderColor              = "#E4E7EC"
linkColor                = "#1A6ACF"

# The verdict bands. Muted deliberately: three saturated badges per row would
# compete with the price, which is the other thing the eye needs.
greenColor  = "#2E7D5B"
orangeColor = "#A8761F"
redColor    = "#9E4F55"

# Inter throughout, for Latin and headings alike, with Noto Sans TC behind it
# for the Chinese in seller titles. Inter's proportions are the closest freely
# licensed match to San Francisco — Apple's own SF Pro and PingFang TC are
# licensed only for apps on Apple platforms and cannot be served from a site.
#
# No code font is declared. Prices and specs use Inter with tabular figures
# instead: a monospaced face reads as terminal output, and Apple sets its own
# prices in SF with tabular numerals rather than switching typeface.
font        = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"

# Restrained headings. The old 900 weights were a brand rule ("the brand never
# whispers") that no longer applies, and at 900 Inter fights the data.
headingFontWeights = [700, 700, 600, 600, 600, 600]

baseRadius   = "8px"
buttonRadius = "8px"

[theme.sidebar]
backgroundColor = "#FFFFFF"
borderColor     = "#E4E7EC"

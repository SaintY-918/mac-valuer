name: Streamlit keep-alive

# Streamlit Community Cloud sleeps an app after ~12h with no visitor traffic
# (docs/operations.md's quota table). A sleeping app greets the next visitor
# with a "waking up" screen instead of the dashboard -- fine for a personal
# tool, bad for a portfolio piece a stranger opens once.
#
# A plain curl does not prevent this and cannot detect it either: Streamlit
# Cloud serves 200 from the app's URL whether it's asleep or awake (see
# docs/decisions.md #35's follow-up), because what actually keeps the app
# warm -- and what the sleep screen's "Yes, get this app back up!" button
# needs a click on -- only exists once a real browser loads the page and its
# JS opens a websocket. src/scripts/wake_streamlit.py drives headless
# Chromium to do exactly that, and clicks the button if the app is asleep.

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6h, well inside the ~12h sleep window
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Wake the dashboard
        run: python -m src.scripts.wake_streamlit

name: Daily Scraper

on:
  schedule:
    - cron: "0 18 * * *"   # UTC 18:00 = Taiwan 02:00
  workflow_dispatch:         # allow manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # PTT and Carousell always run here: both are plain HTTP against
      # server-rendered pages with no anti-bot wall. Shopee's browser path
      # cannot work on a runner — measured, see README — so Shopee joins only
      # when affiliate API credentials make it signed HTTP instead.
      - name: Decide which sources to scrape
        id: sources
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
        run: |
          if [ -n "$SHOPEE_APP_ID" ]; then
            echo "value=all" >> "$GITHUB_OUTPUT"
            echo "Shopee affiliate credentials found -> ptt + shopee + carousell"
          else
            echo "value=ptt,carousell" >> "$GITHUB_OUTPUT"
            echo "No Shopee affiliate credentials -> ptt + carousell"
          fi

      - name: Run scraper pipeline
        env:
          DATABASE_URL:          ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY:        ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL:   ${{ secrets.DISCORD_WEBHOOK_URL }}
          ALERT_VFM_THRESHOLD:   ${{ secrets.ALERT_VFM_THRESHOLD }}
          SHOPEE_APP_ID:         ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET:     ${{ secrets.SHOPEE_APP_SECRET }}
        run: python -m src.main --source ${{ steps.sources.outputs.value }}

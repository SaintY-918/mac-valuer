name: Daily Scraper

on:
  schedule:
    - cron: "0 18 * * *"   # UTC 18:00 = Taiwan 02:00
  workflow_dispatch:         # allow manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # PTT is the only source a runner can reach. Shopee and Carousell both
      # refuse datacenter IPs — measured for each, see docs/decisions.md — and
      # they run from a residential machine instead (scripts/install_schedule.ps1).
      #
      # Carousell used to run here on the theory that plain HTTP against
      # server-rendered pages meant no anti-bot wall. It 403s every request from
      # a runner except robots.txt, which is a deliberate bot policy, not a
      # rendering problem. Leaving it in reported a failure every single night,
      # and an alert that always fires teaches you to ignore the alert.
      #
      # Shopee rejoins here once affiliate API credentials make it signed HTTP
      # rather than a browser.
      - name: Decide which sources to scrape
        id: sources
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
        run: |
          if [ -n "$SHOPEE_APP_ID" ]; then
            echo "value=ptt,shopee" >> "$GITHUB_OUTPUT"
            echo "Shopee affiliate credentials found -> ptt + shopee"
          else
            echo "value=ptt" >> "$GITHUB_OUTPUT"
            echo "No Shopee affiliate credentials -> ptt only"
          fi

      - name: Run scraper pipeline
        env:
          DATABASE_URL:          ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY:        ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL:   ${{ secrets.DISCORD_WEBHOOK_URL }}
          ALERT_VFM_THRESHOLD:   ${{ secrets.ALERT_VFM_THRESHOLD }}
          SHOPEE_APP_ID:         ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET:     ${{ secrets.SHOPEE_APP_SECRET }}
        run: python -m src.main --source ${{ steps.sources.outputs.value }}

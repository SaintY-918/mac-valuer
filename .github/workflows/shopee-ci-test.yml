name: Shopee CI feasibility test

# Manual only. Answers one question: can the browser-based Shopee scraper work
# from a GitHub runner? The daily runs returned zero for three reasons that are
# fixable here (no session on the runner, headless hitting the login wall,
# camoufox's browser never fetched), so the assumption that Shopee blocks
# datacenter IPs was never actually tested.
#
# Touches no database and calls no LLM — it only reports what the scraper saw.
#
# Requires the SHOPEE_STATE_B64 secret: run
#   python -m src.scripts.export_shopee_session
# locally and paste the output in. That value is a live login credential.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The daily workflow only ran `playwright install chromium`; camoufox
      # ships its own patched Firefox and has to be fetched separately, so the
      # browser path could never have launched in CI.
      - name: Fetch camoufox browser
        run: python -m camoufox fetch

      # Done in Python rather than `base64 -d | gunzip > file`: that pipeline
      # rejects any stray whitespace the blob picks up when copied out of a
      # wrapping terminal, and its redirect creates the output file before the
      # decode runs, so a failure still leaves an empty file that looks fine.
      - name: Restore Shopee session
        env:
          SHOPEE_STATE_B64: ${{ secrets.SHOPEE_STATE_B64 }}
        run: python -m src.scripts.restore_shopee_session

      - name: Report runner location
        run: |
          echo "Runner egress IP and geo (Shopee sees this):"
          curl -s https://ipinfo.io | head -20 || true

      - name: Probe Shopee
        env:
          SHOPEE_HEADLESS: "true"
          SHOPEE_MIN_DELAY: "3"
          SHOPEE_MAX_DELAY: "8"
        run: python -m src.scripts.probe_shopee_browser

      # The scraper writes the session back after a successful run; capturing it
      # shows whether Shopee rotated or invalidated the cookies. Skipped unless
      # the file has content, so an empty artifact never implies a good run.
      - name: Upload resulting session for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shopee-state-after-run
          path: shopee_state.json
          retention-days: 1
          if-no-files-found: ignore

name: Tests

# Runs on every push and pull request. The scraper workflow only exercises the
# happy path against live sites once a day; this is the gate that actually
# catches a regression before it ships.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # requirements.txt pulls in playwright and camoufox, which fetch browser
      # binaries and are irrelevant to the test suite. Install only what the
      # tested modules import.
      - name: Install test dependencies
        run: |
          pip install pytest ruff pandas numpy pydantic sqlalchemy python-dotenv requests

      # Runs before the tests: a lint failure is usually faster to read than a
      # test failure caused by the same mistake.
      - name: Lint
        run: python -m ruff check .

      # Stdlib only, so it runs even if the install step above is trimmed.
      - name: Check docs against code
        run: python scripts/check_docs.py

      # No secrets are provided on purpose. The suite has to pass without a
      # Gemini key or a database — that constraint is what keeps pure logic
      # separable from I/O.
      - name: Run tests
        run: python -m pytest tests/ -q --ignore=tests/e2e

  # Separate job because it needs Streamlit, a browser binary and about a
  # minute of setup. Keeping it out of the job above means a logic regression
  # still reports in under two minutes.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install pytest pandas numpy plotly pydantic sqlalchemy python-dotenv                       requests streamlit playwright
          python -m playwright install --with-deps chromium

      # Seeds its own SQLite fixture and runs the real entrypoint against it,
      # so this needs no secrets either.
      - name: Run browser tests
        run: python -m pytest tests/e2e -q
